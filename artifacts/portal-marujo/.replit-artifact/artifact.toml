kind = "web"
previewPath = "/"
title = "Portal Marujo"
version = "1.0.0"
id = "artifacts/portal-marujo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25984

[services.development]
run = "pnpm --filter @workspace/portal-marujo run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/portal-marujo", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.run]
args = ["node", "artifacts/portal-marujo/serve.mjs"]

[services.production.run.env]
PORT = "25984"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "25984"
BASE_PATH = "/"
