kind = "web"
previewPath = "/"
title = "Portal Marujo"
version = "1.0.0"
id = "artifacts/portal-marujo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25984

[services.development]
run = "pnpm --filter @workspace/portal-marujo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portal-marujo", "run", "build" ]
publicDir = "artifacts/portal-marujo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25984"
BASE_PATH = "/"
